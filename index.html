<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCredit UTVT - Calculadora de Préstamos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>SmartCredit UTVT</h1>
        <p>Calculadora de préstamos con sistema de amortización francés e IVA (16%)</p>

        <div class="formulario">
            <label for="monto">Monto (MXN):</label>
            <input type="number" id="monto" placeholder="Ej. 10000">

            <label for="tasa">Tasa de interés anual (%):</label>
            <input type="number" id="tasa" step="0.01" placeholder="Ej. 12">

            <label for="plazo">Plazo (meses):</label>
            <input type="number" id="plazo" placeholder="Ej. 12">

            <button id="btn-calcular">Calcular</button>

            <div class="selector-moneda">
                <label for="moneda">Ver resultados en:</label>
                <select id="moneda">
                    <option value="MXN" selected>MXN (Pesos)</option>
                    <option value="USD">USD (Dólares)</option>
                    <option value="EUR">EUR (Euros)</option>
                    <option value="TODAS">TODAS</option>
                </select>
            </div>
        </div>

        <div id="resumen"></div>
        <div id="equiv-divisas"></div>
        <div id="resultados"></div>

        <div class="botones-exportar">
            <button id="btn-excel">📊 Exportar a Excel</button>
            <button id="btn-pdf">📄 Exportar a PDF</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
